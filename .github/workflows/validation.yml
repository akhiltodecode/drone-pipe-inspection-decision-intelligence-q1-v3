name: Reproducibility validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scientific-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Compile, test, and validate contracts
        run: |
          python -m compileall -q .
          python -m unittest discover -v
          python validate_pipeline.py
      - name: Parallel smoke experiment
        run: |
          python paper_pipeline.py \
            --output-dir outputs_ci \
            --replications 2 \
            --bootstrap-resamples 1000 \
            --jobs 2
          python verify_outputs.py --output-dir outputs_ci

  static-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development toolchain
        run: python -m pip install -r requirements-dev.txt
      - name: Lint, type-check, and test with coverage
        run: |
          ruff check .
          mypy drone_study/config.py drone_study/runtime.py
          pytest
