[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers --strict-config --cov=drone_study --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["drone_study"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]
ignore = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
